config:
  debug: false
  lang: "system"
  auto-reconnect: true

  proxy:
    enabled: false

  voicecraft:
    host: "127.0.0.1"
    port: 9050
    login-token: "__GENERATED_LOGIN_TOKEN__"
    auto-start: true
    shutdown-on-disable: true
    invariant-globalization: true
    ready-timeout-ms: 20000
    install-directory: "voicecraft-runtime"

  voice:
    proximity-distance: 30
    proximity-toggle: true
    voice-effects: true

    not-in-voice-symbol: "\u2727"
    in-voice-symbol: "\u2726"

    send-bind-message: true # Show a message when a player links to VoiceCraft
    send-disconnect-message: true # Show a message when a player leaves voice chat
    send-voicecraft-disconnect-message: true # Show a message when the VoiceCraft connection closes
    send-connection-lost-message: true # Show a message when the VoiceCraft connection is lost
    position-update-interval-ticks: 5

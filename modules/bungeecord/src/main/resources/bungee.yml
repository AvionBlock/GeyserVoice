name: GeyserVoice
version: 0.1.0-SNAPSHOT
main: team.avion.bungeecord.GeyserVoice
description: Plugin that adds support for using VoiceCraft on Java servers.
author: lil-jon-crunk
website: https://geyservoice.avion.team

commands:
  voice:
    permission: voice.cmd

permissions:
  voice.cmd:
    default: true
  voice.connect:
    default: op
  voice.reconnect:
    default: op
  voice.disconnect:
    default: op
  voice.bind:
    default: true
  voice.bindfake:
    default: op
  voice.reload:
    default: op

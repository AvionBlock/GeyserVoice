plugins {
    id 'java'
    id 'com.gradleup.shadow'
}

dependencies {
    implementation project(':common')
    compileOnly "net.md-5:bungeecord-api:${project.bungeecord_version}"
    compileOnly "org.projectlombok:lombok:${project.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
    implementation "net.kyori:adventure-api:4.17.0"
    implementation "net.kyori:adventure-text-serializer-gson:4.17.0"
}

shadowJar {
    archiveClassifier.set('')
    // relocate 'io.greitan.avion.common', 'io.greitan.avion.bungee.common'
}

processResources {
    filter { line ->
        line.replace('{{ version }}', project.version.toString())
            .replace('{{ description }}', project.description.toString())
            .replace('{{ name }}', rootProject.name.toString())
            .replace('{{ url }}', 'https://uninode.de')
    }
}

jar {
    archiveClassifier.set('unshaded')
}

plugins {
    id 'io.github.goooler.shadow'
}

dependencies {
    implementation project(':common')
    compileOnly "net.md-5:bungeecord-api:${project.bungeecord_version}"
}

shadowJar {
    archiveClassifier.set('')
    relocate 'io.greitan.avion.common', 'io.greitan.avion.bungee.common'
}

blossom {
    replaceToken '{{ version }}', project.version
    replaceToken '{{ description }}', project.description
    replaceToken '{{ name }}', rootProject.name
    replaceToken '{{ url }}', 'https://uninode.de'
}
